spring:
  application:
    name: devjobs-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/devjobs}
    username: ${DATABASE_USERNAME:devjobs}
    password: ${DATABASE_PASSWORD:devjobs}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
