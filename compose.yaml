services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/devjobs
      DATABASE_USERNAME: devjobs
      DATABASE_PASSWORD: devjobs
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/v1/jobs"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: devjobs
      POSTGRES_USER: devjobs
      POSTGRES_PASSWORD: devjobs
    ports:
      - "5432:5432"
    volumes:
      - devjobs-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devjobs -d devjobs"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  devjobs-postgres:
